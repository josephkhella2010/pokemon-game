name: CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main
      - dev

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      # ========================================
      # CHECKOUT
      # ========================================

      - name: Checkout
        uses: actions/checkout@v4

      # ========================================
      # FRONTEND
      # ========================================

      - name: Frontend - Install
        working-directory: ./frontend/train
        run: npm install

      - name: Frontend - Run
        working-directory: ./frontend/train
        run: npm run build

      - name: Frontend - Test
        run: echo "Frontend tests - NOT STARTED YET"

      - name: Frontend - Docker Build
        run: docker build -t frontend ./frontend/train

      # ========================================
      # BACKEND
      # ========================================

      - name: Backend - Install
        working-directory: ./backend
        run: npm install

      - name: Backend - Run
        working-directory: ./backend
        run: npm run build

      - name: Backend - Test
        working-directory: ./backend
        run: npm test

      # ========================================
      # BACKEND ENVIRONMENT
      # ========================================

      - name: Backend - Create .env
        run: |
          echo "PORT=${{ secrets.PORT }}" > backend/.env
          echo "MONGO_URI=${{ secrets.MONGO_URI }}" >> backend/.env

      # ========================================
      # BACKEND DOCKER
      # ========================================

      - name: Backend - Docker Build
        run: docker build -t backend ./backend

      # ========================================
      # DOCKER COMPOSE
      # ========================================

      - name: Docker - Build
        run: docker compose build

      - name: Docker - Start Frontend and Backend
        run: docker compose up -d

      - name: Docker - Check Containers
        run: docker compose ps

      - name: Docker - Show Logs
        if: failure()
        run: docker compose logs

      - name: Docker - Stop Containers
        if: always()
        run: docker compose down

      # ========================================
      # FINAL
      # ========================================

      - name: Final - All Steps Completed
        run: |
          echo "========================================"
          echo "CI/CD PIPELINE COMPLETED"
          echo "========================================"
          echo "Frontend - Install: SUCCESS"
          echo "Frontend - Build: SUCCESS"
          echo "Frontend - Test: SUCCESS"
          echo "Frontend - Docker Build: SUCCESS"
          echo "Backend - Install: SUCCESS"
          echo "Backend - Build: SUCCESS"
          echo "Backend - Test: SUCCESS"
          echo "Backend - Environment: SUCCESS"
          echo "Backend - Docker Build: SUCCESS"
          echo "Docker - Build: SUCCESS"
          echo "Docker - Start: SUCCESS"
          echo "Docker - Check: SUCCESS"
          echo "========================================"
          echo "ALL FRONTEND AND BACKEND STEPS PASSED"
          echo "========================================"
