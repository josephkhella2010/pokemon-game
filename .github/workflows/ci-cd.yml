name: CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main
      - dev

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      # ========================================
      # CHECKOUT
      # ========================================

      - name: Checkout
        uses: actions/checkout@v4

      # ========================================
      # FRONTEND
      # ========================================

      - name: Frontend - Install
        working-directory: ./frontend/train
        run: npm install

      - name: Frontend - Build
        working-directory: ./frontend/train
        run: npm run build

      - name: Frontend - Test
        run: echo "Frontend tests - NOT STARTED YET"

      - name: Frontend - Docker Build
        run: docker build -t frontend ./frontend/train

      # ========================================
      # BACKEND
      # ========================================

      - name: Backend - Install
        working-directory: ./backend
        run: npm install

      - name: Backend - Create .env
        run: |
          echo "PORT=${{ secrets.PORT }}" > backend/.env
          echo "MONGO_URI=${{ secrets.MONGO_URI }}" >> backend/.env

      - name: Backend - Build
        run: docker build -t backend ./backend

      - name: Backend - Run
        run: docker run -d --name backend-test --env-file backend/.env -p 5000:5000 backend

      - name: Backend - Check
        run: docker ps

      - name: Backend - Logs
        if: failure()
        run: docker logs backend-test

      - name: Backend - Stop
        if: always()
        run: docker stop backend-test || true

      # ========================================
      # DOCKER COMPOSE
      # ========================================

      - name: Docker - Build
        run: docker compose build

      - name: Docker - Start Frontend and Backend
        run: docker compose up -d

      - name: Docker - Check Containers
        run: docker compose ps

      - name: Docker - Show Logs
        if: failure()
        run: docker compose logs

      - name: Docker - Stop Containers
        if: always()
        run: docker compose down

      # ========================================
      # FINAL
      # ========================================

      - name: Final - All Steps Completed
        run: |
          echo "========================================"
          echo "CI/CD PIPELINE COMPLETED"
          echo "========================================"
          echo "Frontend - Install: SUCCESS"
          echo "Frontend - Build: SUCCESS"
          echo "Frontend - Test: NOT STARTED YET"
          echo "Frontend - Docker Build: SUCCESS"
          echo "Backend - Install: SUCCESS"
          echo "Backend - Environment: SUCCESS"
          echo "Backend - Docker Build: SUCCESS"
          echo "Backend - Run: SUCCESS"
          echo "Backend - Check: SUCCESS"
          echo "Backend - Test: NOT STARTED YET"
          echo "Docker - Build: SUCCESS"
          echo "Docker - Start: SUCCESS"
          echo "Docker - Check: SUCCESS"
          echo "========================================"
          echo "CI/CD PIPELINE COMPLETED"
          echo "========================================"
